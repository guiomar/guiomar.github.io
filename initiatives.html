---
layout: page
title: Initiatives
slug: initiatives
permalink: /initiatives/
lede: Open science initiatives I lead or contribute to.
---
<ul class="init-list">
  {% for i in site.data.initiatives %}
  <li class="init">
    <a class="init__logo" href="{{ i.url }}" tabindex="-1" aria-hidden="true"><img src="{{ '/assets/img/logos/' | append: i.logo | relative_url }}" alt="" loading="lazy"></a>
    <div>
      <h2><a href="{{ i.url }}">{{ i.name }}</a></h2>
      {% if i.role %}<span class="init__role">{{ i.role }}</span>{% endif %}
      <p>{{ i.text }}</p>
    </div>
  </li>
  {% endfor %}
</ul>
