{% for s in site.data.vitae %}

  <h2>{{ s.title }}</h2>
  <ul class="cv-list">
    {% for e in s.entries %}
    <li><span class="yr">{{ e.years }}</span><span>{% if e.link %}<a href="{{ e.link }}">{{ e.text }}</a>{% else %}{{ e.text }}{% endif %}</span></li>
    {% endfor %}
  </ul>
</section>
{% endfor %}
