---
layout: page
title: Vitae
slug: vitae
permalink: /vitae/
---
{% for s in site.data.vitae %}
<section class="cv-block cv-block--{{ forloop.index }}">
  <h2>{{ s.title }}</h2>
  <ul class="cv-entries">
    {% for e in s.entries %}
    <li>
      <p class="cv-entry__text">{{ e.text }}{% if e.link %} <a class="cv-entry__link" href="{{ e.link }}">(view)</a>{% endif %}</p>
      <p class="cv-entry__date">{{ e.years }}</p>
    </li>
    {% endfor %}
  </ul>
</section>
{% endfor %}
