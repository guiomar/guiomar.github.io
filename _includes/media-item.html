<li class="media-item media-item--{{ item.type }}" data-type="{{ item.type }}">
  <div class="media-item__thumb">{% if item.image %}<img src="{{ '/assets/img/media/' | append: item.image | relative_url }}" alt="" loading="lazy">{% endif %}</div>
  <div class="media-item__body">
    <p class="media-item__meta"><span class="media-item__type">{% if item.type == 'tv' %}TV{% elsif item.type == 'radio' %}Radio and podcasts{% else %}Press{% endif %}</span> {{ item.outlet }}, <time datetime="{{ item.date }}">{{ item.date | date: "%-d %b %Y" }}</time></p>
    <p class="media-item__title">{% if item.url %}<a href="{{ item.url }}">{{ item.title }}</a>{% else %}{{ item.title }}{% endif %}</p>
  </div>
</li>
